<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-labelledby="title desc">
  <title id="title">COMMANDO SSD4 LIVE Logo</title>
  <desc id="desc">โลโก้ตัวอักษร SSD4 LIVE สำหรับเว็บไซต์ COMMANDO SSD4</desc>
  <defs>
    <linearGradient id="silver" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".36" stop-color="#d7d7d7"/>
      <stop offset=".72" stop-color="#8f8f8f"/>
      <stop offset="1" stop-color="#f4f4f4"/>
    </linearGradient>
    <linearGradient id="dark" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1b1d22"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#000" flood-opacity=".62"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#fff" flood-opacity=".25"/>
    </filter>
  </defs>
  <rect width="720" height="300" rx="42" fill="url(#dark)"/>
  <path d="M54 55h612l-28 34H86z" fill="#ffffff" opacity=".09"/>
  <g filter="url(#shadow)">
    <text x="360" y="158" text-anchor="middle"
          font-family="Impact, Arial Black, Tahoma, sans-serif"
          font-size="126" font-weight="900" font-style="italic"
          letter-spacing="-6" fill="url(#silver)" stroke="#050608" stroke-width="8">
      SSD4
    </text>
    <path d="M190 181h340l-22 58H168z" fill="#15171c" stroke="#e9e9e9" stroke-width="5"/>
    <text x="349" y="226" text-anchor="middle"
          font-family="Arial Black, Tahoma, sans-serif"
          font-size="48" font-weight="900" font-style="italic"
          letter-spacing="22" fill="#f4f4f4">
      LIVE
    </text>
  </g>
  <path d="M65 254h590" stroke="#fff" stroke-opacity=".22" stroke-width="2"/>
  <text x="360" y="278" text-anchor="middle"
        font-family="Segoe UI, Tahoma, sans-serif"
        font-size="18" font-weight="800" letter-spacing="4" fill="#c9c9c9">
    COMMANDO SSD4
  </text>
</svg>
